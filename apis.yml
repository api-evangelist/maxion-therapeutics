aid: maxion-therapeutics
name: Maxion Therapeutics
description: Maxion Therapeutics is a UK biotechnology company developing protein therapeutics
  using its proprietary KnotBody technology, which fuses venom-derived knottin miniproteins
  with antibodies to drug previously untreatable ion channel- and GPCR-driven diseases across
  autoimmune, inflammatory, and related therapeutic areas. Maxion is a preclinical-stage
  drug-discovery company, not an API or developer-platform provider; this profile is maintained
  in the API Evangelist network for portfolio-tracking purposes and has no public API, developer
  portal, SDK, or machine-readable API surface.
